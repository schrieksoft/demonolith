# Visit https://goreleaser.com for documentation on how to customize this
# behavior. demonolith is a standalone CLI binary (not a Terraform provider),
# so no GPG signing or provider-registry manifest is required.
version: 2
before:
  hooks:
    - go mod tidy
builds:
- env:
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - linux
    - darwin
    - windows
  goarch:
    - amd64
    - arm64
  binary: '{{ .ProjectName }}'
archives:
- format: tar.gz
  format_overrides:
    - goos: windows
      format: zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
release:
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
changelog:
  disable: true
